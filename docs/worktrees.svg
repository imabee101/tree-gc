<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="304" viewBox="0 0 1000 304" role="img" aria-labelledby="title desc">
  <title id="title">One repository, two idle worktrees</title>
  <desc id="desc">After 30 simulated days, atlas-finished can be quarantined. An ignored .env protects atlas-experiment.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#35514a"/></pattern>
  </defs>
  <rect width="1000" height="304" rx="16" fill="#102921"/>
  <rect width="1000" height="304" rx="16" fill="url(#grid)"/>
  <g font-family="monospace" fill="#c1d6ca">
    <text x="36" y="42" font-size="18">$ tree-gc plan --all --days 30</text>
    <text x="966" y="42" text-anchor="end" font-size="17" fill="#d7efa3">SHADOW MODE</text>
  </g>
  <path d="M36 62H964" stroke="#4d695a"/>
  <g fill="none" stroke-width="4">
    <path d="M64 177H140C192 177 166 122 218 122H252" stroke="#a7d8bd"/>
    <path d="M140 177C192 177 166 230 218 230H252" stroke="#f2c782"/>
    <circle cx="59" cy="177" r="10" stroke="#eff4da" fill="#102921"/>
  </g>
  <g font-family="monospace">
    <text x="36" y="216" fill="#c1d6ca" font-size="19">atlas</text>
    <rect x="249" y="82" width="715" height="84" rx="9" fill="#203f34" stroke="#577868"/>
    <rect x="249" y="189" width="715" height="84" rx="9" fill="#36392c" stroke="#857654"/>
    <text x="274" y="119" font-size="25" fill="#f4f6ec">atlas-finished</text>
    <text x="274" y="148" font-size="18" fill="#c1d6ca">Clean checkout. Branch stays in Git.</text>
    <text x="940" y="118" text-anchor="end" font-size="18" fill="#bde8c2">QUARANTINE</text>
    <text x="274" y="226" font-size="25" fill="#f4f6ec">atlas-experiment</text>
    <text x="274" y="255" font-size="18" fill="#ddd4b5">An ignored .env holds local state.</text>
    <text x="940" y="225" text-anchor="end" font-size="18" fill="#f2c782">PROTECTED</text>
  </g>
</svg>
